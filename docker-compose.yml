services:
  api:
    build: .
    image: aitrabajo
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  panel:
    build: .
    image: aitrabajo
    command: python -m streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8502:8501"
    depends_on:
      api:
        condition: service_healthy
